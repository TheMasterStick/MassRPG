name: Archive legacy junction branch

on:
  push:
    branches:
      - claude/massrpg-procedural-game-sossii
    paths:
      - .github/junction-archive-trigger.txt

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve unique legacy commit as tag and delete branch
        shell: bash
        run: |
          set -euo pipefail
          branch='junction-builder-work'
          expected='115bf2265a7b13cc7a349cbd9c6d74b49badc746'
          tag='legacy/junction-builder-work-20260912'

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --prune
          actual="$(git rev-parse "origin/$branch")"
          if [[ "$actual" != "$expected" ]]; then
            echo "REFUSING: $branch moved from audited $expected to $actual" >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tagged="$(git rev-parse "refs/tags/$tag")"
            if [[ "$tagged" != "$expected" ]]; then
              echo "REFUSING: existing tag $tag points to $tagged instead of $expected" >&2
              exit 1
            fi
          else
            git tag "$tag" "$expected"
            git push origin "refs/tags/$tag"
          fi

          git push origin --delete "$branch"
