name: Validate MassRPG content drafts

on:
  pull_request:
    paths:
      - 'ContentData/Drafts/**'
      - 'ContentData/Schemas/**'
      - 'tools/online-data-editor/**'
      - 'package.json'
  push:
    paths:
      - 'ContentData/Drafts/**'
      - 'ContentData/Schemas/**'
      - 'tools/online-data-editor/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check Online Data Editor scripts
        run: |
          node --check tools/online-data-editor/server.mjs
          node --check tools/online-data-editor/validate-drafts.mjs
          node --check tools/online-data-editor/build-candidate.mjs
      - name: Validate repository-backed MassRPG drafts
        run: node tools/online-data-editor/validate-drafts.mjs
