name: CSharp core smoke compile

on:
  push:
    branches:
      - chatgpt/unity-csharp-migration
      - claude/massrpg-procedural-game-sossii
    paths:
      - 'unity/Assets/MassRPG/Core/**'
      - 'unity/Assets/MassRPG/Data/**'
      - 'unity/Assets/MassRPG/Server/**'
      - 'unity/Assets/MassRPG/EditorCore/**'
      - 'unity/Assets/MassRPG/Tests/Editor/**'
      - '.github/workflows/csharp-core-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-engine-independent-assemblies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate Unity-shaped engine-independent projects
        shell: bash
        run: |
          mkdir -p .ci/csharp-assemblies

          write_common_properties() {
            cat <<'EOF'
              <PropertyGroup>
                <TargetFramework>net8.0</TargetFramework>
                <LangVersion>9.0</LangVersion>
                <Nullable>disable</Nullable>
                <ImplicitUsings>disable</ImplicitUsings>
                <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
                <TreatWarningsAsErrors>false</TreatWarningsAsErrors>
              </PropertyGroup>
          EOF
          }

          {
            echo '<Project Sdk="Microsoft.NET.Sdk">'
            write_common_properties
            cat <<'EOF'
              <ItemGroup>
                <Compile Include="../../unity/Assets/MassRPG/Core/**/*.cs" />
              </ItemGroup>
            </Project>
          EOF
          } > .ci/csharp-assemblies/MassRPG.Core.csproj

          {
            echo '<Project Sdk="Microsoft.NET.Sdk">'
            write_common_properties
            cat <<'EOF'
              <ItemGroup>
                <Compile Include="../../unity/Assets/MassRPG/Data/**/*.cs" />
              </ItemGroup>
              <ItemGroup>
                <ProjectReference Include="MassRPG.Core.csproj" />
              </ItemGroup>
            </Project>
          EOF
          } > .ci/csharp-assemblies/MassRPG.Data.csproj

          {
            echo '<Project Sdk="Microsoft.NET.Sdk">'
            write_common_properties
            cat <<'EOF'
              <ItemGroup>
                <Compile Include="../../unity/Assets/MassRPG/Server/**/*.cs" />
              </ItemGroup>
              <ItemGroup>
                <ProjectReference Include="MassRPG.Core.csproj" />
                <ProjectReference Include="MassRPG.Data.csproj" />
              </ItemGroup>
            </Project>
          EOF
          } > .ci/csharp-assemblies/MassRPG.Server.csproj

          {
            echo '<Project Sdk="Microsoft.NET.Sdk">'
            write_common_properties
            cat <<'EOF'
              <ItemGroup>
                <Compile Include="../../unity/Assets/MassRPG/EditorCore/**/*.cs" />
              </ItemGroup>
              <ItemGroup>
                <ProjectReference Include="MassRPG.Core.csproj" />
                <ProjectReference Include="MassRPG.Data.csproj" />
              </ItemGroup>
            </Project>
          EOF
          } > .ci/csharp-assemblies/MassRPG.EditorCore.csproj

      - name: Compile engine-independent migration assemblies separately as C# 9
        shell: bash
        run: |
          dotnet build .ci/csharp-assemblies/MassRPG.Server.csproj --configuration Release --nologo
          dotnet build .ci/csharp-assemblies/MassRPG.EditorCore.csproj --configuration Release --nologo

  test-engine-independent-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate Unity-shaped engine-independent projects and NUnit project
        shell: bash
        run: |
          mkdir -p .ci/csharp-tests

          write_common_properties() {
            cat <<'EOF'
              <PropertyGroup>
                <TargetFramework>net8.0</TargetFramework>
                <LangVersion>9.0</LangVersion>
                <Nullable>disable</Nullable>
                <ImplicitUsings>disable</ImplicitUsings>
                <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              </PropertyGroup>
          EOF
          }

          {
            echo '<Project Sdk="Microsoft.NET.Sdk">'
            write_common_properties
            cat <<'EOF'
              <ItemGroup>
                <Compile Include="../../unity/Assets/MassRPG/Core/**/*.cs" />
              </ItemGroup>
            </Project>
          EOF
          } > .ci/csharp-tests/MassRPG.Core.csproj

          {
            echo '<Project Sdk="Microsoft.NET.Sdk">'
            write_common_properties
            cat <<'EOF'
              <ItemGroup>
                <Compile Include="../../unity/Assets/MassRPG/Data/**/*.cs" />
              </ItemGroup>
              <ItemGroup>
                <ProjectReference Include="MassRPG.Core.csproj" />
              </ItemGroup>
            </Project>
          EOF
          } > .ci/csharp-tests/MassRPG.Data.csproj

          {
            echo '<Project Sdk="Microsoft.NET.Sdk">'
            write_common_properties
            cat <<'EOF'
              <ItemGroup>
                <Compile Include="../../unity/Assets/MassRPG/Server/**/*.cs" />
              </ItemGroup>
              <ItemGroup>
                <ProjectReference Include="MassRPG.Core.csproj" />
                <ProjectReference Include="MassRPG.Data.csproj" />
              </ItemGroup>
            </Project>
          EOF
          } > .ci/csharp-tests/MassRPG.Server.csproj

          {
            echo '<Project Sdk="Microsoft.NET.Sdk">'
            write_common_properties
            cat <<'EOF'
              <ItemGroup>
                <Compile Include="../../unity/Assets/MassRPG/EditorCore/**/*.cs" />
              </ItemGroup>
              <ItemGroup>
                <ProjectReference Include="MassRPG.Core.csproj" />
                <ProjectReference Include="MassRPG.Data.csproj" />
              </ItemGroup>
            </Project>
          EOF
          } > .ci/csharp-tests/MassRPG.EditorCore.csproj

          cat > .ci/csharp-tests/MassRPG.EngineTests.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <LangVersion>9.0</LangVersion>
              <Nullable>disable</Nullable>
              <ImplicitUsings>disable</ImplicitUsings>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <IsTestProject>true</IsTestProject>
              <IsPackable>false</IsPackable>
            </PropertyGroup>
            <ItemGroup>
          EOF

          count=0
          while IFS= read -r file; do
            if grep -Eq 'UnityEngine|UnityEditor|MassRPG\.Client|using MassRPG\.Editor;' "$file"; then
              echo "Skipping Unity-dependent test: $file"
              continue
            fi
            printf '    <Compile Include="../../%s" />\n' "$file" >> .ci/csharp-tests/MassRPG.EngineTests.csproj
            count=$((count + 1))
          done < <(find unity/Assets/MassRPG/Tests/Editor -maxdepth 1 -name '*.cs' -type f | sort)

          cat >> .ci/csharp-tests/MassRPG.EngineTests.csproj <<'EOF'
            </ItemGroup>
            <ItemGroup>
              <ProjectReference Include="MassRPG.Core.csproj" />
              <ProjectReference Include="MassRPG.Data.csproj" />
              <ProjectReference Include="MassRPG.Server.csproj" />
              <ProjectReference Include="MassRPG.EditorCore.csproj" />
            </ItemGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.NET.Test.Sdk" Version="17.10.0" />
              <PackageReference Include="NUnit" Version="3.14.0" />
              <PackageReference Include="NUnit3TestAdapter" Version="4.5.0" />
            </ItemGroup>
          </Project>
          EOF
          echo "Selected $count engine-independent test source files."

      - name: Run engine-independent migration tests against separate assemblies as C# 9
        run: dotnet test .ci/csharp-tests/MassRPG.EngineTests.csproj --configuration Release --nologo --verbosity normal
