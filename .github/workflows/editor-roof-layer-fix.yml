name: One-off editor roof layer fix

on:
  push:
    branches:
      - claude/massrpg-procedural-game-sossii

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/massrpg-procedural-game-sossii
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Make roof rendering authoritative and toggleable
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/editor/ObjectAuthoringTools.ts')
          s = p.read_text()
          s = s.replace(
          """  const canvas = root.querySelector<HTMLCanvasElement>('.editor-canvas')!;\n  const toolbar = root.querySelector<HTMLElement>('.editor-toolbar')!;\n  const wrap = canvas.parentElement!;\n  if (!canvas || !toolbar || !wrap) return;\n""",
          """  const canvas = root.querySelector<HTMLCanvasElement>('.editor-canvas')!;\n  const toolbar = root.querySelector<HTMLElement>('.editor-toolbar')!;\n  if (!canvas || !toolbar) return;\n""")
          s = s.replace("  let frame = 0;\n", "")
          s = s.replace(
          """ * visual layer. The base editor renderer owns structure transforms; this overlay renders roofs only.\n""",
          """ * visual layer. The base editor renderer owns both structure transforms and authored roofs.\n""")
          anchor = """  const roofSelect = document.createElement('select');\n  roofSelect.title = 'Paint authored roof pieces using the current rotation/mirror transform.';\n  for (const optionDef of ROOF_OPTIONS) {\n    const option = document.createElement('option');\n    option.value = optionDef.id;\n    option.textContent = optionDef.label;\n    roofSelect.append(option);\n  }\n\n"""
          insert = anchor + """  const ROOF_VISIBILITY_KEY = 'massrpg.editor.roofsVisible';\n  let roofsVisible = window.localStorage.getItem(ROOF_VISIBILITY_KEY) !== 'false';\n  const roofVisibilityBtn = document.createElement('button');\n  roofVisibilityBtn.type = 'button';\n  roofVisibilityBtn.title = 'Hide/show authored roofs in the editor without deleting them.';\n\n"""
          assert anchor in s
          s = s.replace(anchor, insert, 1)
          s = s.replace(
          """    flipXBtn.style.outline = flipX ? '2px solid #e5b84f' : '';\n    flipYBtn.style.outline = flipY ? '2px solid #e5b84f' : '';\n  }\n  refreshButtons();\n  toolbar.append(rotateBtn, flipXBtn, flipYBtn, roofSelect);\n\n  const overlay = document.createElement('canvas');\n  overlay.style.position = 'absolute';\n  overlay.style.inset = '0';\n  overlay.style.width = '100%';\n  overlay.style.height = '100%';\n  overlay.style.pointerEvents = 'none';\n  overlay.style.zIndex = '1';\n  overlay.style.imageRendering = 'pixelated';\n  wrap.append(overlay);\n  const overlayCtx = overlay.getContext('2d')!;\n  if (!overlayCtx) return;\n  const imageCache = new Map<string, HTMLImageElement>();\n\n""",
          """    flipXBtn.style.outline = flipX ? '2px solid #e5b84f' : '';\n    flipYBtn.style.outline = flipY ? '2px solid #e5b84f' : '';\n    roofVisibilityBtn.textContent = roofsVisible ? 'Roofs: Visible' : 'Roofs: Hidden';\n    roofVisibilityBtn.style.outline = roofsVisible ? '' : '2px solid #e5b84f';\n  }\n  refreshButtons();\n  toolbar.append(rotateBtn, flipXBtn, flipYBtn, roofSelect, roofVisibilityBtn);\n\n""", 1)
          old = """  roofSelect.addEventListener('change', () => {\n    roofMode = roofSelect.value as RoofMode;\n    canvas.style.cursor = roofMode === 'off' ? '' : 'crosshair';\n    redraw();\n  });\n"""
          new = """  roofSelect.addEventListener('change', () => {\n    roofMode = roofSelect.value as RoofMode;\n    if (roofMode !== 'off' && !roofsVisible) {\n      roofsVisible = true;\n      window.localStorage.setItem(ROOF_VISIBILITY_KEY, 'true');\n      refreshButtons();\n    }\n    canvas.style.cursor = roofMode === 'off' ? '' : 'crosshair';\n    redraw();\n  });\n  roofVisibilityBtn.addEventListener('click', () => {\n    roofsVisible = !roofsVisible;\n    window.localStorage.setItem(ROOF_VISIBILITY_KEY, roofsVisible ? 'true' : 'false');\n    if (!roofsVisible && roofMode !== 'off') {\n      roofMode = 'off';\n      roofSelect.value = 'off';\n      canvas.style.cursor = '';\n    }\n    refreshButtons();\n    redraw();\n  });\n"""
          assert old in s
          s = s.replace(old, new, 1)
          start = s.index("  function imageFor(path: string): HTMLImageElement {")
          end_marker = "  redraw();\n}\n"
          end = s.rindex(end_marker)
          s = s[:start] + """  function redraw(): void {\n    canvas.dispatchEvent(new CustomEvent('massrpg-editor-redraw'));\n  }\n\n""" + s[end:]
          p.write_text(s)

          p = Path('src/editor/WorldEditorV6.ts')
          s = p.read_text()
          anchor = """  canvas.addEventListener('contextmenu', (event) => event.preventDefault());\n"""
          assert anchor in s
          s = s.replace(anchor, anchor + """  canvas.addEventListener('massrpg-editor-redraw', () => draw());\n""", 1)
          old = """  function drawObjects(startX: number, startY: number, cols: number, rows: number, originX: number, originY: number, tilePx: number): void {\n    for (let row = 0; row < rows; row++) {\n      for (let col = 0; col < cols; col++) {\n        const x = startX + col;\n        const y = startY + row;\n        const cell = currentLayer().cells[cellKey(x, y)] as TransformableEditorCell | undefined;\n        if (!cell) continue;\n        const sx = originX + col * tilePx;\n        const sy = originY + row * tilePx;\n        if (cell.structure) drawStructureSprite(cell.structure, sx, sy, tilePx, cell.structureTransform);\n        else if (cell.resource) drawSprite(`/sprites/resources/${cell.resource}.png`, sx, sy, tilePx, cell.resource.startsWith('rock_') ? '#222' : '#356c36');\n        else if (cell.spawner) drawSprite(`/sprites/monsters/${cell.spawner}.png`, sx, sy, tilePx, '#aa3030');\n      }\n    }\n  }\n"""
          new = """  function drawObjects(startX: number, startY: number, cols: number, rows: number, originX: number, originY: number, tilePx: number): void {\n    for (let row = 0; row < rows; row++) {\n      for (let col = 0; col < cols; col++) {\n        const x = startX + col;\n        const y = startY + row;\n        const cell = currentLayer().cells[cellKey(x, y)] as TransformableEditorCell | undefined;\n        if (!cell) continue;\n        const sx = originX + col * tilePx;\n        const sy = originY + row * tilePx;\n        if (cell.structure) drawStructureSprite(cell.structure, sx, sy, tilePx, cell.structureTransform);\n        else if (cell.resource) drawSprite(`/sprites/resources/${cell.resource}.png`, sx, sy, tilePx, cell.resource.startsWith('rock_') ? '#222' : '#356c36');\n        else if (cell.spawner) drawSprite(`/sprites/monsters/${cell.spawner}.png`, sx, sy, tilePx, '#aa3030');\n      }\n    }\n\n    // Authored roofs belong to the same authoritative camera/render pass as the\n    // terrain and structures. They can be hidden while furnishing interiors.\n    if (window.localStorage.getItem('massrpg.editor.roofsVisible') === 'false') return;\n    for (let row = 0; row < rows; row++) {\n      for (let col = 0; col < cols; col++) {\n        const x = startX + col;\n        const y = startY + row;\n        const cell = currentLayer().cells[cellKey(x, y)] as TransformableEditorCell | undefined;\n        if (!cell?.roof) continue;\n        const sx = originX + col * tilePx;\n        const sy = originY + row * tilePx;\n        drawSprite(`/sprites/roof/${cell.roof.id}.png`, sx, sy, tilePx, '#8d6b46', cell.roof.transform);\n      }\n    }\n  }\n"""
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Build
        run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name "MassRPG editor fixer"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/editor-roof-layer-fix.yml
          git add src/editor/ObjectAuthoringTools.ts src/editor/WorldEditorV6.ts
          git commit -m "Make editor roofs toggleable and camera-stable"
          git push origin HEAD:claude/massrpg-procedural-game-sossii
