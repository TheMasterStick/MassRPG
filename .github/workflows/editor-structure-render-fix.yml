name: One-off editor structure render fix

on:
  push:
    branches:
      - claude/massrpg-procedural-game-sossii

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/massrpg-procedural-game-sossii
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Make stored structure transforms authoritative in the editor renderer
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected block: {label}')
              return text.replace(old, new, 1)

          p = Path('src/editor/WorldEditorV6.ts')
          s = p.read_text()
          s = must_replace(
              s,
              "import type { ResourceType, StructureType, TileType, WorldPlane } from '../world/types';\n",
              "import type { ResourceType, StructureType, TileType, WorldPlane } from '../world/types';\nimport type { ObjectTransform, TransformableEditorCell } from '../world/EditorObjects';\n",
              'WorldEditorV6 import',
          )
          old = '''  function drawObjects(startX: number, startY: number, cols: number, rows: number, originX: number, originY: number, tilePx: number): void {\n    for (let row = 0; row < rows; row++) {\n      for (let col = 0; col < cols; col++) {\n        const x = startX + col;\n        const y = startY + row;\n        const cell = currentLayer().cells[cellKey(x, y)];\n        if (!cell) continue;\n        const sx = originX + col * tilePx;\n        const sy = originY + row * tilePx;\n        if (cell.structure) drawSprite(`/sprites/structures/${cell.structure}.png`, sx, sy, tilePx, '#d8c9a1');\n        else if (cell.resource) drawSprite(`/sprites/resources/${cell.resource}.png`, sx, sy, tilePx, cell.resource.startsWith('rock_') ? '#222' : '#356c36');\n        else if (cell.spawner) drawSprite(`/sprites/monsters/${cell.spawner}.png`, sx, sy, tilePx, '#aa3030');\n      }\n    }\n  }\n\n  function drawSprite(path: string, sx: number, sy: number, tilePx: number, fallback: string): void {\n    const img = imageFor(path, draw);\n    if (img.complete && img.naturalWidth > 0) {\n      const h = Math.max(tilePx, tilePx * img.naturalHeight / img.naturalWidth);\n      ctx.drawImage(img, sx, sy + tilePx - h, tilePx, h);\n    } else {\n      ctx.fillStyle = fallback;\n      ctx.beginPath();\n      ctx.arc(sx + tilePx / 2, sy + tilePx / 2, Math.max(2, tilePx * 0.3), 0, Math.PI * 2);\n      ctx.fill();\n    }\n  }\n'''
          new = '''  function drawObjects(startX: number, startY: number, cols: number, rows: number, originX: number, originY: number, tilePx: number): void {\n    for (let row = 0; row < rows; row++) {\n      for (let col = 0; col < cols; col++) {\n        const x = startX + col;\n        const y = startY + row;\n        const cell = currentLayer().cells[cellKey(x, y)] as TransformableEditorCell | undefined;\n        if (!cell) continue;\n        const sx = originX + col * tilePx;\n        const sy = originY + row * tilePx;\n        if (cell.structure) drawSprite(`/sprites/structures/${cell.structure}.png`, sx, sy, tilePx, '#d8c9a1', cell.structureTransform);\n        else if (cell.resource) drawSprite(`/sprites/resources/${cell.resource}.png`, sx, sy, tilePx, cell.resource.startsWith('rock_') ? '#222' : '#356c36');\n        else if (cell.spawner) drawSprite(`/sprites/monsters/${cell.spawner}.png`, sx, sy, tilePx, '#aa3030');\n      }\n    }\n  }\n\n  function drawSprite(\n    path: string,\n    sx: number,\n    sy: number,\n    tilePx: number,\n    fallback: string,\n    transform?: ObjectTransform,\n  ): void {\n    const img = imageFor(path, draw);\n    if (img.complete && img.naturalWidth > 0) {\n      const h = Math.max(tilePx, tilePx * img.naturalHeight / img.naturalWidth);\n      if (transform) {\n        ctx.save();\n        ctx.translate(sx + tilePx / 2, sy + tilePx - h / 2);\n        ctx.rotate(transform.rotation * Math.PI / 180);\n        ctx.scale(transform.flipX ? -1 : 1, transform.flipY ? -1 : 1);\n        ctx.drawImage(img, -tilePx / 2, -h / 2, tilePx, h);\n        ctx.restore();\n      } else {\n        ctx.drawImage(img, sx, sy + tilePx - h, tilePx, h);\n      }\n    } else {\n      ctx.fillStyle = fallback;\n      ctx.beginPath();\n      ctx.arc(sx + tilePx / 2, sy + tilePx / 2, Math.max(2, tilePx * 0.3), 0, Math.PI * 2);\n      ctx.fill();\n    }\n  }\n'''
          s = must_replace(s, old, new, 'WorldEditorV6 object renderer')
          p.write_text(s)

          p = Path('src/editor/ObjectAuthoringTools.ts')
          s = p.read_text()
          s = must_replace(
              s,
              "import type { StructureType, WorldPlane } from '../world/types';\n",
              "import type { WorldPlane } from '../world/types';\n",
              'ObjectAuthoringTools import',
          )
          s = must_replace(
              s,
              ' * visual layer. A transparent overlay previews both layers in editor space.\n',
              ' * visual layer. The base editor renderer owns structure transforms; this overlay renders roofs only.\n',
              'ObjectAuthoringTools comment',
          )
          old_identity = '''  function isIdentity(value: ObjectTransform | undefined): boolean {\n    return !value || (value.rotation === 0 && !value.flipX && !value.flipY);\n  }\n\n'''
          s = must_replace(s, old_identity, '', 'ObjectAuthoringTools identity helper')
          old_block = '''          if (cell.structure && cell.structure !== 'blocker' && !isIdentity(cell.structureTransform)) {\n            // V6 already drew the untransformed structure below. Dim that cell so\n            // the authoritative transformed preview is visually unambiguous.\n            overlayCtx.fillStyle = 'rgba(14,16,18,.54)';\n            overlayCtx.fillRect(p.x, p.y, tilePx, tilePx);\n            const image = imageFor(`/sprites/structures/${cell.structure as StructureType}.png`);\n            drawTransformedImage(image, p.x, p.y, tilePx, cell.structureTransform!, true);\n            overlayCtx.strokeStyle = 'rgba(238,195,76,.72)';\n            overlayCtx.lineWidth = 1;\n            overlayCtx.strokeRect(p.x + 1, p.y + 1, Math.max(1, tilePx - 2), Math.max(1, tilePx - 2));\n          }\n\n'''
          s = must_replace(s, old_block, '', 'ObjectAuthoringTools duplicate structure overlay')
          p.write_text(s)
          PY
      - name: Verify build
        run: npm run build
      - name: Commit verified fix and remove one-off workflow
        run: |
          rm .github/workflows/editor-structure-render-fix.yml
          git config user.name "MassRPG build fixer"
          git config user.email "actions@users.noreply.github.com"
          git add src/editor/WorldEditorV6.ts src/editor/ObjectAuthoringTools.ts .github/workflows/editor-structure-render-fix.yml
          git commit -m "Render authored structure transforms directly"
          git push origin HEAD:claude/massrpg-procedural-game-sossii
