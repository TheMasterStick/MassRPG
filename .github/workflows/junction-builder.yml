name: One-off junction builder

on:
  push:
    branches:
      - junction-builder-work

permissions:
  contents: write

jobs:
  build-junctions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: junction-builder-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch exact-source wall and fence junction variants
        run: python .github/scripts/build_junctions.py
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Build
        run: npm run build
      - name: Commit verified junction system
        run: |
          rm .github/workflows/junction-builder.yml
          rm .github/scripts/build_junctions.py
          git config user.name "MassRPG junction builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add exact-source wall and fence junction variants"
          git push origin HEAD:junction-builder-work
