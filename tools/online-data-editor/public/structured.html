<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MassRPG Structured Draft Editor</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#17191d;color:#eef1f5}*{box-sizing:border-box}body{margin:0;background:#17191d}button,input,select,textarea{font:inherit}header{padding:12px 16px;border-bottom:1px solid #343840;background:#202329;display:flex;gap:12px;align-items:center;flex-wrap:wrap}header a{color:#b9cce3;text-decoration:none}header strong{font-size:17px}.status{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}.pill{padding:4px 8px;border:1px solid #454b56;border-radius:999px;background:#282c33;font-size:12px}nav{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid #343840;background:#1d2025;overflow:auto}nav a{color:#c7ced8;text-decoration:none;padding:7px 10px;border-radius:6px;white-space:nowrap}nav a.active{background:#334358;color:#fff}.workspace{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:calc(100vh - 96px)}aside{border-right:1px solid #343840;background:#1d2025;min-height:0;display:flex;flex-direction:column}.toolbar{padding:10px;border-bottom:1px solid #343840;display:grid;gap:8px}.row{display:flex;gap:8px;align-items:center}.list{padding:8px;overflow:auto;min-height:180px}.entry{width:100%;text-align:left;padding:9px 10px;margin-bottom:6px;border:1px solid transparent;border-radius:6px;background:transparent;color:#eef1f5}.entry:hover{background:#252a31}.entry.selected{background:#293748;border-color:#465e78}.entry strong,.entry small{display:block}.entry small{color:#9fa7b3;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}main{min-width:0;overflow:auto}.editor{max-width:1040px;margin:0 auto;padding:16px}.title{display:flex;gap:12px;justify-content:space-between;align-items:start;margin-bottom:12px}h1{font-size:21px;margin:0}h2{font-size:15px;margin:0 0 10px}.muted,.note{color:#aab1bc}.note{font-size:12px;line-height:1.45}.card{border:1px solid #343a44;border-radius:8px;background:#20242a;padding:14px;margin-bottom:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}label{display:grid;gap:5px;font-size:12px;color:#c4cad3}.check{display:flex;align-items:center;gap:7px}.check input{width:auto}input,select,textarea{width:100%;color:#eef1f5;background:#131519;border:1px solid #3a4049;border-radius:6px;padding:8px 9px;outline:none}input:focus,select:focus,textarea:focus{border-color:#7f9fc9;box-shadow:0 0 0 2px #7f9fc933}input[readonly]{color:#aab1bc;background:#1b1e23}textarea{min-height:95px;resize:vertical}textarea.tall{min-height:180px}button{cursor:pointer;color:#eef1f5;background:#303641;border:1px solid #48505d;border-radius:6px;padding:8px 11px}button.primary{background:#365f8a;border-color:#527ca7}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap}.commit{display:grid;grid-template-columns:minmax(240px,1fr) auto;gap:8px;margin-top:10px}.message{min-height:20px;margin-top:8px;font-size:13px}.error{color:#ffadad}.ok{color:#aee3b1}.work-note{border-left:3px solid #b18b43;padding-left:10px;color:#d3c09b;font-size:12px;line-height:1.5}@media(max-width:820px){.workspace{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #343840;max-height:330px}.grid2,.grid3,.commit{grid-template-columns:1fr}.status{margin-left:0}}
  </style>
</head>
<body>
<header><a href="/">← Data Editor</a><strong id="pageTitle">MassRPG Draft Editor</strong><div class="status"><span class="pill" id="branchPill">Branch: …</span><span class="pill" id="changesPill">Draft changes: …</span></div></header>
<nav><a href="/items">Items &amp; Equipment</a><a href="/creatures" data-kind="creatures">Creatures</a><a href="/resources" data-kind="resources">Resources</a><a href="/recipes" data-kind="recipes">Recipes</a><a href="/definitions" data-kind="definitions">Other Definitions</a><a href="/assets">Asset Backlog</a></nav>
<div class="workspace">
  <aside><div class="toolbar"><div class="row"><button class="primary" id="newBtn" type="button">+ New</button><button id="reloadBtn" type="button">Reload</button></div><input id="search" type="search" placeholder="Search by name or ID"></div><div class="list" id="list"></div></aside>
  <main><form class="editor" id="form"><div class="title"><div><h1 id="heading">New draft</h1><div class="muted" id="subheading">Create a repository-backed draft.</div></div><label class="check"><input id="ready" type="checkbox"> Ready for review</label></div><div id="fields"></div><section class="card"><div class="actions"><button class="primary" id="saveBtn" type="submit">Save draft file</button><button id="clearBtn" type="button">Clear / new</button></div><div class="commit"><input id="commitMessage" maxlength="120" value="Update MassRPG data drafts"><button id="commitBtn" type="button">Commit &amp; Push</button></div><div id="message" class="message" aria-live="polite"></div></section></form></main>
</div>
<script>
(()=>{
  const $=id=>document.getElementById(id);
  const kind=location.pathname.replace(/^\//,'');
  if(!['creatures','resources','recipes','definitions'].includes(kind)){location.href='/';return;}
  const singular={creatures:'creature',resources:'resource',recipes:'recipe',definitions:'definition'}[kind];
  const title={creatures:'Creatures & Monsters',resources:'Resources',recipes:'Recipes & Production',definitions:'Other Game Definitions'}[kind];
  document.title=`MassRPG ${title} Editor`;$('pageTitle').textContent=`MassRPG ${title} Editor`;
  for(const link of document.querySelectorAll('nav a[data-kind]'))link.classList.toggle('active',link.dataset.kind===kind);
  const state={docs:[],selectedId:null,status:null};
  const option=(values,current)=>values.map(v=>`<option${v===current?' selected':''}>${esc(v)}</option>`).join('');
  const num=id=>Number($(id)?.value||0),checked=id=>!!$(id)?.checked,value=id=>($(id)?.value??'').trim();
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function msg(text,cls=''){$('message').textContent=text;$('message').className=`message ${cls}`.trim();}
  async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||`Request failed (${r.status}).`);return b;}
  async function refreshStatus(){const s=await api('/api/status');state.status=s;$('branchPill').textContent=`Branch: ${s.branch||'(detached)'}`;$('changesPill').textContent=`Draft changes: ${s.changedFiles}`;$('commitBtn').disabled=!s.pushAllowed||s.changedFiles===0;}
  function commonIdentity(d){return `<section class="card"><h2>Identity</h2><div class="grid2"><label>Permanent ID<input id="id" required maxlength="80" pattern="[a-z0-9][a-z0-9._/-]{1,79}" value="${esc(d.id||'')}"></label><label>Display name<input id="displayName" required maxlength="100" value="${esc(d.displayName||'')}"></label></div></section>`;}
  function presentation(d,defaultState='needs-assets'){const p={assetState:defaultState,iconAssetId:'',modelAssetId:'',portraitAssetId:'',animationSetAssetId:'',notes:'',...(d.presentation||{})};return `<section class="card"><h2>Presentation / assets</h2><div class="work-note">You can leave all asset IDs blank while at work. Set the state to <b>Needs assets</b> and describe what we need; it will appear in the Asset Backlog for home/Unity work.</div><div style="height:10px"></div><div class="grid3"><label>Asset state<select id="assetState">${option(['needs-assets','placeholder','linked','final','not-required'],p.assetState)}</select></label><label>Icon asset ID (optional)<input id="iconAssetId" value="${esc(p.iconAssetId||'')}"></label><label>Model asset ID (optional)<input id="modelAssetId" value="${esc(p.modelAssetId||'')}"></label><label>Portrait asset ID (optional)<input id="portraitAssetId" value="${esc(p.portraitAssetId||'')}"></label><label>Animation set asset ID (optional)<input id="animationSetAssetId" value="${esc(p.animationSetAssetId||'')}"></label></div><div style="height:10px"></div><label>Visual / asset notes<textarea id="presentationNotes" maxlength="2000" placeholder="Example: needs a battered low-poly iron sword model and 64px inventory icon">${esc(p.notes||'')}</textarea></label></section>`;}
  function defaults(){if(kind==='creatures')return{id:'',displayName:'',combatLevel:1,maxHitpoints:3,attackLevel:1,strengthLevel:1,defenceLevel:1,attackBonus:0,strengthBonus:0,defenceBonus:0,combatStyle:'Melee',attackIntervalMilliseconds:2400,attackRangeTiles:1,disposition:'Neutral',footprintWidth:1,footprintHeight:1,aggroRadiusTiles:4,leashRadiusTiles:8,persistentNamedInstance:false,presentation:{assetState:'needs-assets'},editorState:'draft'};if(kind==='resources')return{id:'',displayName:'',gatheringSkill:'Mining',requiredLevel:1,experience:0,yieldItemId:'',respawnSeconds:8,availabilityMode:'Personal',minimumYield:1,maximumYield:1,requiredToolKind:'Pickaxe',minimumToolTier:1,presentation:{assetState:'needs-assets'},editorState:'draft'};if(kind==='recipes')return{id:'',displayName:'',skill:'Cooking',levelRequired:1,inputs:[{itemId:'',quantity:1}],outputItemId:'',outputQuantity:1,xp:0,durationMilliseconds:1200,category:'',stationId:null,toolRequiredId:null,canBurn:false,failureOutputItemId:null,failureXpFraction:.1,presentation:{assetState:'not-required'},editorState:'draft'};return{id:'',displayName:'',kind:'NPC',description:'',tags:[],notes:'',data:{},presentation:{assetState:'needs-assets'},editorState:'draft'};}
  function renderFields(d,existing){let html=commonIdentity(d);
    if(kind==='creatures')html+=`<section class="card"><h2>Combat levels</h2><div class="grid3"><label>Combat level<input id="combatLevel" type="number" min="1" value="${d.combatLevel}"></label><label>Hitpoints<input id="maxHitpoints" type="number" min="1" value="${d.maxHitpoints}"></label><label>Attack<input id="attackLevel" type="number" min="1" max="300" value="${d.attackLevel}"></label><label>Strength<input id="strengthLevel" type="number" min="1" max="300" value="${d.strengthLevel}"></label><label>Defence<input id="defenceLevel" type="number" min="1" max="300" value="${d.defenceLevel}"></label></div></section><section class="card"><h2>Combat behavior</h2><div class="grid3"><label>Attack bonus<input id="attackBonus" type="number" value="${d.attackBonus}"></label><label>Strength bonus<input id="strengthBonus" type="number" value="${d.strengthBonus}"></label><label>Defence bonus<input id="defenceBonus" type="number" value="${d.defenceBonus}"></label><label>Combat style<select id="combatStyle">${option(['Melee','Ranged','Magic'],d.combatStyle)}</select></label><label>Attack interval (ms)<input id="attackIntervalMilliseconds" type="number" min="1" value="${d.attackIntervalMilliseconds}"></label><label>Attack range (tiles)<input id="attackRangeTiles" type="number" min="1" value="${d.attackRangeTiles}"></label><label>Disposition<select id="disposition">${option(['Passive','Neutral','Aggressive'],d.disposition)}</select></label><label>Aggro radius<input id="aggroRadiusTiles" type="number" min="0" value="${d.aggroRadiusTiles}"></label><label>Leash radius<input id="leashRadiusTiles" type="number" min="0" value="${d.leashRadiusTiles}"></label></div></section><section class="card"><h2>Physical footprint</h2><div class="grid3"><label>Width<input id="footprintWidth" type="number" min="1" value="${d.footprintWidth}"></label><label>Height<input id="footprintHeight" type="number" min="1" value="${d.footprintHeight}"></label><label class="check" style="align-self:end;padding-bottom:8px"><input id="persistentNamedInstance" type="checkbox"${d.persistentNamedInstance?' checked':''}> Persistent named/rare identity</label></div></section>${presentation(d,'needs-assets')}`;
    if(kind==='resources')html+=`<section class="card"><h2>Gathering</h2><div class="grid3"><label>Skill<select id="gatheringSkill">${option(['Woodcutting','Mining','Fishing','Farming'],d.gatheringSkill)}</select></label><label>Required level<input id="requiredLevel" type="number" min="1" max="300" value="${d.requiredLevel}"></label><label>XP<input id="experience" type="number" min="0" value="${d.experience}"></label><label>Yield item ID<input id="yieldItemId" required value="${esc(d.yieldItemId)}"></label><label>Respawn seconds<input id="respawnSeconds" type="number" min="0" value="${d.respawnSeconds}"></label><label>Availability<select id="availabilityMode">${option(['Personal','Shared'],d.availabilityMode)}</select></label></div></section><section class="card"><h2>Yield & tool</h2><div class="grid3"><label>Minimum yield<input id="minimumYield" type="number" min="1" value="${d.minimumYield}"></label><label>Maximum yield<input id="maximumYield" type="number" min="1" value="${d.maximumYield}"></label><label>Tool kind<select id="requiredToolKind">${option(['None','Hatchet','Pickaxe','FishingNet','FishingRod','LobsterPot','Harpoon'],d.requiredToolKind)}</select></label><label>Minimum tool tier<input id="minimumToolTier" type="number" min="0" value="${d.minimumToolTier}"></label></div></section>${presentation(d,'needs-assets')}`;
    if(kind==='recipes'){const lines=(d.inputs||[]).map(x=>`${x.itemId}:${x.quantity}`).join('\n');html+=`<section class="card"><h2>Production</h2><div class="grid3"><label>Skill<select id="skill">${option(['Cooking','Firemaking','Smithing','Crafting','Fletching','Herblore','Construction'],d.skill)}</select></label><label>Required level<input id="levelRequired" type="number" min="1" max="300" value="${d.levelRequired}"></label><label>Category<input id="category" maxlength="100" value="${esc(d.category)}"></label><label>XP<input id="xp" type="number" min="0" value="${d.xp}"></label><label>Duration (ms)<input id="durationMilliseconds" type="number" min="1" value="${d.durationMilliseconds}"></label><label>Station ID (optional)<input id="stationId" value="${esc(d.stationId||'')}"></label><label>Tool item ID (optional)<input id="toolRequiredId" value="${esc(d.toolRequiredId||'')}"></label></div></section><section class="card"><h2>Inputs</h2><label>One item per line as <code>item_id:quantity</code><textarea id="inputs" required>${esc(lines)}</textarea></label></section><section class="card"><h2>Output</h2><div class="grid3"><label>Output item ID<input id="outputItemId" required value="${esc(d.outputItemId)}"></label><label>Output quantity<input id="outputQuantity" type="number" min="1" value="${d.outputQuantity}"></label><label class="check" style="align-self:end;padding-bottom:8px"><input id="canBurn" type="checkbox"${d.canBurn?' checked':''}> Can burn / fail</label><label>Failure output item ID<input id="failureOutputItemId" value="${esc(d.failureOutputItemId||'')}"></label><label>Failure XP fraction (0-1)<input id="failureXpFraction" type="number" min="0" max="1" step="0.01" value="${d.failureXpFraction}"></label></div></section>${presentation(d,'not-required')}`;}
    if(kind==='definitions'){const dataText=JSON.stringify(d.data||{},null,2);html+=`<section class="card"><h2>Definition type</h2><div class="grid2"><label>Kind<select id="definitionKind">${option(['NPC','Shop','Loot Table','Quest','Ability','Spell','Status Effect','Faction','Service','Transport','Build Piece','Dialogue','World Event','Achievement','Other'],d.kind)}</select></label><label>Tags (comma-separated)<input id="tags" value="${esc((d.tags||[]).join(', '))}" placeholder="capital, blacksmith, starter-zone"></label></div><div style="height:10px"></div><label>Description<textarea id="description" maxlength="5000" placeholder="What this game entry is and how the player encounters/uses it">${esc(d.description||'')}</textarea></label></section><section class="card"><h2>Design notes</h2><label>Notes<textarea class="tall" id="notes" maxlength="10000" placeholder="Write the behavior, balance, dialogue idea, stock rules, quest flow, requirements or anything else we need to preserve.">${esc(d.notes||'')}</textarea></label></section><section class="card"><h2>Structured gameplay data (optional)</h2><div class="note">This is an escape hatch for fields that do not have a dedicated form yet. Leave <code>{}</code> if you do not need it. When this definition becomes a runtime system, we will promote these fields into a proper typed editor without changing the permanent ID.</div><div style="height:8px"></div><label>JSON object<textarea class="tall" id="definitionData">${esc(dataText)}</textarea></label></section>${presentation(d,'needs-assets')}`;}
    $('fields').innerHTML=html;$('id').readOnly=existing;$('ready').checked=d.editorState==='ready-for-review';$('heading').textContent=existing?d.displayName:`New ${singular}`;$('subheading').textContent=existing?`Editing ${d.id}. Permanent ID is locked after first save.`:kind==='definitions'?'Create any game-content concept now; promote it to a typed runtime schema when its system is implemented.':'Create a repository-backed gameplay draft.';}
  function commonPresentation(){return{assetState:value('assetState')||'needs-assets',iconAssetId:value('iconAssetId')||null,modelAssetId:value('modelAssetId')||null,portraitAssetId:value('portraitAssetId')||null,animationSetAssetId:value('animationSetAssetId')||null,notes:$('presentationNotes')?.value||''};}
  function parseInputs(){return value('inputs').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map((line,i)=>{const idx=line.lastIndexOf(':');if(idx<1)throw new Error(`Input line ${i+1} must use item_id:quantity.`);const itemId=line.slice(0,idx).trim(),quantity=Number(line.slice(idx+1).trim());if(!itemId||!Number.isInteger(quantity)||quantity<1)throw new Error(`Input line ${i+1} is invalid.`);return{itemId,quantity};});}
  function payload(){const base={id:value('id'),displayName:value('displayName'),presentation:commonPresentation(),editorState:checked('ready')?'ready-for-review':'draft'};if(kind==='creatures')return{...base,combatLevel:num('combatLevel'),maxHitpoints:num('maxHitpoints'),attackLevel:num('attackLevel'),strengthLevel:num('strengthLevel'),defenceLevel:num('defenceLevel'),attackBonus:num('attackBonus'),strengthBonus:num('strengthBonus'),defenceBonus:num('defenceBonus'),combatStyle:value('combatStyle'),attackIntervalMilliseconds:num('attackIntervalMilliseconds'),attackRangeTiles:num('attackRangeTiles'),disposition:value('disposition'),footprintWidth:num('footprintWidth'),footprintHeight:num('footprintHeight'),aggroRadiusTiles:num('aggroRadiusTiles'),leashRadiusTiles:num('leashRadiusTiles'),persistentNamedInstance:checked('persistentNamedInstance')};if(kind==='resources')return{...base,gatheringSkill:value('gatheringSkill'),requiredLevel:num('requiredLevel'),experience:num('experience'),yieldItemId:value('yieldItemId'),respawnSeconds:num('respawnSeconds'),availabilityMode:value('availabilityMode'),minimumYield:num('minimumYield'),maximumYield:num('maximumYield'),requiredToolKind:value('requiredToolKind'),minimumToolTier:num('minimumToolTier')};if(kind==='recipes')return{...base,skill:value('skill'),levelRequired:num('levelRequired'),inputs:parseInputs(),outputItemId:value('outputItemId'),outputQuantity:num('outputQuantity'),xp:num('xp'),durationMilliseconds:num('durationMilliseconds'),category:value('category'),stationId:value('stationId')||null,toolRequiredId:value('toolRequiredId')||null,canBurn:checked('canBurn'),failureOutputItemId:value('failureOutputItemId')||null,failureXpFraction:num('failureXpFraction')};let data;try{data=JSON.parse($('definitionData').value||'{}');}catch(e){throw new Error(`Structured gameplay data is not valid JSON: ${e.message}`);}if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('Structured gameplay data must be a JSON object.');return{...base,kind:value('definitionKind'),description:$('description').value,tags:value('tags').split(',').map(x=>x.trim()).filter(Boolean),notes:$('notes').value,data};}
  function renderList(){const q=$('search').value.trim().toLowerCase(),list=$('list');list.replaceChildren();const filtered=state.docs.filter(d=>`${d.id||''} ${d.displayName||''} ${d.kind||''}`.toLowerCase().includes(q));if(!filtered.length){const p=document.createElement('div');p.className='note';p.style.padding='10px';p.textContent=state.docs.length?'No drafts match this search.':'No drafts yet.';list.append(p);return;}for(const d of filtered){const b=document.createElement('button');b.type='button';b.className=`entry${state.selectedId===d.id?' selected':''}`;const name=document.createElement('strong');name.textContent=d.displayName||'(unnamed)';const meta=document.createElement('small');meta.textContent=`${d.id||'(missing id)'}${d.kind?' · '+d.kind:''} · ${d.editorState||'draft'}`;b.append(name,meta);b.addEventListener('click',()=>select(d));list.append(b);}}
  function select(d){if(d._loadError){msg(`Cannot edit ${d.id}: ${d._loadError}`,'error');return;}state.selectedId=d.id;renderFields({...defaults(),...d,presentation:{...defaults().presentation,...(d.presentation||{})}},true);renderList();msg(`Loaded ${d.displayName}.`);}
  function fresh(){state.selectedId=null;renderFields(defaults(),false);renderList();msg(`New ${singular} form ready.`);$('id').focus();}
  async function load(preserve=true){const prior=preserve?state.selectedId:null,b=await api(`/api/${kind}`);state.docs=b.documents||b[kind]||[];renderList();if(prior){const found=state.docs.find(x=>x.id===prior);if(found)select(found);}}
  $('form').addEventListener('submit',async e=>{e.preventDefault();if(!$('form').reportValidity())return;$('saveBtn').disabled=true;msg('Saving draft…');try{const result=await api(`/api/${kind}`,{method:'POST',body:JSON.stringify(payload())});state.selectedId=result.document.id;await load(true);await refreshStatus();msg(`Saved ${result.document.displayName} to repository drafts.`,'ok');}catch(err){msg(err.message,'error');}finally{$('saveBtn').disabled=false;}});
  $('commitBtn').addEventListener('click',async()=>{if(!state.status?.pushAllowed)return;$('commitBtn').disabled=true;msg('Committing and pushing draft files…');try{const r=await api('/api/commit',{method:'POST',body:JSON.stringify({message:value('commitMessage')})});await refreshStatus();msg(`Pushed commit ${r.commit} to ${r.branch}.`,'ok');}catch(e){msg(e.message,'error');await refreshStatus().catch(()=>{});}});
  $('newBtn').addEventListener('click',fresh);$('clearBtn').addEventListener('click',fresh);$('reloadBtn').addEventListener('click',async()=>{msg('Reloading drafts…');try{await Promise.all([load(true),refreshStatus()]);msg('Drafts reloaded.','ok');}catch(e){msg(e.message,'error');}});$('search').addEventListener('input',renderList);
  fresh();Promise.all([load(false),refreshStatus()]).then(()=>msg('Editor ready.')).catch(e=>msg(e.message,'error'));
})();
</script>
</body>
</html>
